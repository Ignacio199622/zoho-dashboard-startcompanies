<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Start Companies — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#006AFE;--dark:#001627;--cyan:#01C9E2;--gold:#C9A227;--green:#00b67a;
  --surface:#0a2540;--surface2:#112d4a;--border:#1a3a5c;--text:#e8edf2;--text2:#8899aa;
  --radius:12px;--red:#ff4757;
}
body{font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--text);min-height:100vh}
a{color:var(--cyan);text-decoration:none}

/* ===== LOGIN ===== */
.login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--dark)}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:48px 40px;width:100%;max-width:400px;text-align:center}
.login-logo-img{height:48px;margin-bottom:24px}
.login-title{font-size:22px;font-weight:700;margin-bottom:4px}
.login-sub{font-size:14px;color:var(--text2);margin-bottom:32px}
.login-input{width:100%;padding:12px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:inherit;font-size:14px;margin-bottom:12px;outline:none;transition:border .2s}
.login-input:focus{border-color:var(--blue)}
.login-input::placeholder{color:var(--text2)}
.login-btn{width:100%;padding:12px;border-radius:8px;border:none;background:var(--blue);color:#fff;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .2s;margin-top:8px}
.login-btn:hover{opacity:.9}
.login-error{color:var(--red);font-size:13px;margin-top:12px;min-height:20px}

/* ===== HEADER ===== */
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 32px;background:var(--surface);border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:12px}
.logo-img{height:32px}
.header-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.status-text{font-size:12px;color:var(--text2)}
.user-badge{background:var(--surface2);padding:6px 14px;border-radius:20px;font-size:13px;color:var(--text2)}
.logout-btn{background:none;border:1px solid var(--border);color:var(--text2);padding:6px 14px;border-radius:20px;font-size:12px;font-family:inherit;cursor:pointer;transition:all .2s}
.logout-btn:hover{border-color:var(--text2);color:var(--text)}

/* ===== LEMA ===== */
.lema-bar{text-align:center;padding:14px 16px;background:linear-gradient(90deg,var(--dark),rgba(0,106,254,.12),var(--dark));border-bottom:1px solid var(--border);animation:lemaIn 1.2s ease-out;position:relative;overflow:hidden}
.lema-bar::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),var(--gold),var(--cyan),transparent)}
.lema-text{font-size:15px;font-weight:700;background:linear-gradient(90deg,var(--cyan),var(--gold),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:4px;text-transform:uppercase;animation:lemaShine 4s ease-in-out infinite}
@keyframes lemaIn{0%{opacity:0;transform:translateY(-8px)}100%{opacity:1;transform:translateY(0)}}
@keyframes lemaShine{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3)}}

/* ===== LAYOUT ===== */
.container{max-width:1440px;margin:0 auto;padding:20px 32px}

/* ===== METRICS ===== */
.metrics-section{margin-bottom:20px}
.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:12px}
.metric-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;position:relative;overflow:hidden}
.metric-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--blue)}
.metric-card.cyan::before{background:var(--cyan)}
.metric-card.gold::before{background:var(--gold)}
.metric-card.green::before{background:var(--green)}
.metric-card.red::before{background:var(--red)}
.metric-card.purple::before{background:#b388ff}
.metric-label{font-size:11px;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.metric-value{font-size:28px;font-weight:700;line-height:1;color:var(--blue)}
.metric-card.cyan .metric-value{color:var(--cyan)}
.metric-card.gold .metric-value{color:var(--gold)}
.metric-card.green .metric-value{color:var(--green)}
.metric-card.red .metric-value{color:var(--red)}
.metric-card.purple .metric-value{color:#b388ff}
.metric-sub{font-size:11px;color:var(--text2);margin-top:4px}
.metrics-row-title{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;display:flex;align-items:center;gap:8px;user-select:none;padding:6px 0;transition:color .2s}
.metrics-row-title:hover{color:var(--text)}
.metrics-row-title .toggle-arrow{font-size:10px;transition:transform .2s;display:inline-block}
.metrics-row-title .toggle-arrow.collapsed{transform:rotate(-90deg)}
.metrics-group{overflow:hidden;transition:max-height .3s ease,opacity .2s ease;max-height:500px;opacity:1}
.metrics-group.collapsed{max-height:0;opacity:0;margin-bottom:0}

/* ===== TABS ===== */
.tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--surface);border-radius:var(--radius);padding:4px;border:1px solid var(--border);overflow-x:auto}
.tab{padding:10px 24px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;color:var(--text2);transition:all .2s;border:none;background:none;font-family:inherit;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{background:var(--blue);color:#fff}

/* ===== FILTERS ===== */
.filters-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:flex-end}
.filter-group{display:flex;flex-direction:column;gap:4px}
.filter-label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.filter-select,.filter-date{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:inherit;font-size:13px;outline:none;min-width:150px;transition:border .2s}
.filter-select:focus,.filter-date:focus{border-color:var(--blue)}
.filter-date{min-width:140px}
.filter-date::-webkit-calendar-picker-indicator{filter:invert(.7)}
.multi-select{position:relative;min-width:180px}
.multi-select-btn{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:13px;cursor:pointer;transition:border .2s;gap:8px}
.multi-select-btn:hover,.multi-select-btn.open{border-color:var(--blue)}
.multi-select-btn .arrow{font-size:10px;color:var(--text2)}
.multi-select-btn .count{background:var(--blue);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;font-weight:600}
.multi-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:8px;max-height:220px;overflow-y:auto;z-index:100;display:none;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.multi-dropdown.show{display:block}
.multi-dropdown label{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:13px;cursor:pointer;transition:background .15s}
.multi-dropdown label:hover{background:var(--surface2)}
.multi-dropdown input[type="checkbox"]{accent-color:var(--blue);width:14px;height:14px}
.btn-clear-filters{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:none;color:var(--text2);font-family:inherit;font-size:13px;cursor:pointer;transition:all .2s;align-self:flex-end}
.btn-clear-filters:hover{border-color:var(--text2);color:var(--text)}

/* ===== TABLE ===== */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.table-header{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.table-title-group{display:flex;align-items:center;gap:16px}
.table-title{font-size:16px;font-weight:600}
.table-count{font-size:13px;color:var(--text2)}
.export-group{display:flex;gap:8px}
.btn-export{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.btn-export:hover{border-color:var(--blue);color:var(--blue)}
.btn-export svg{width:14px;height:14px}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{background:var(--surface2)}
th{padding:12px 16px;text-align:left;font-weight:600;color:var(--text2);text-transform:uppercase;font-size:11px;letter-spacing:.5px;white-space:nowrap;border-bottom:1px solid var(--border)}
td{padding:12px 16px;border-bottom:1px solid var(--border);white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
tr:hover td{background:rgba(0,106,254,.05)}
tr:last-child td{border-bottom:none}
tr.alert-row td{background:rgba(201,162,39,.08);border-left:3px solid var(--gold)}
tr.alert-row td:first-child{padding-left:12px}
tr.alert-row td:first-child::before{content:'\1F525 ';font-size:13px}

/* ===== LECTURA Y ALERTAS ===== */
.lectura{background:linear-gradient(135deg,rgba(0,106,254,.10),rgba(1,201,226,.05));border:1px solid var(--border);border-left:3px solid var(--blue);border-radius:var(--radius);padding:16px 20px;margin-bottom:14px}
.lectura-titulo{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-bottom:6px}
.lectura-texto{font-size:15px;line-height:1.65;margin:0}
.lectura-texto b{color:#fff;font-weight:700}
.lectura-alerta{color:var(--gold)}

.alertas{margin-bottom:16px}
.alertas-titulo{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-bottom:8px}
.alertas-nota{text-transform:none;letter-spacing:0;font-weight:400;opacity:.75}
.alertas-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.alerta{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;text-align:left;
  background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--text2);border-radius:var(--radius);
  padding:12px 14px;cursor:pointer;font-family:inherit;color:var(--text);transition:all .15s}
.alerta:hover{border-color:var(--blue);transform:translateY(-1px)}
.alerta-n{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.alerta-txt{font-size:11px;color:var(--text2);line-height:1.45}
.alerta-txt b{font-size:13px;color:var(--text);font-weight:600}
.alerta-ver{font-size:11px;color:var(--text2);white-space:nowrap}
.alerta-red{border-left-color:var(--red)}.alerta-red .alerta-n{color:var(--red)}
.alerta-gold{border-left-color:var(--gold)}.alerta-gold .alerta-n{color:var(--gold)}
.alerta-cyan{border-left-color:var(--cyan)}.alerta-cyan .alerta-n{color:var(--cyan)}

.comp-table td,.comp-table th{white-space:nowrap}
.comp-table .num{text-align:right;font-variant-numeric:tabular-nums}
.comp-mejor td{background:rgba(0,182,122,.10)}
.comp-mejor td:first-child{box-shadow:inset 3px 0 0 var(--green)}
.comp-cero td{color:var(--text2)}
.comp-cero td:first-child{box-shadow:inset 3px 0 0 var(--red)}

.buscador{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:inherit;font-size:13px;outline:none;min-width:230px;transition:border .2s}
.buscador:focus{border-color:var(--blue)}
.buscador::placeholder{color:var(--text2)}

.th-orden{cursor:pointer;user-select:none;transition:color .15s}
.th-orden:hover{color:var(--text)}
.th-activa{color:var(--blue)}
.th-flecha{font-size:9px}

.aviso-filtro{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 24px;background:rgba(201,162,39,.10);border-bottom:1px solid var(--border);font-size:12px;color:var(--gold)}
.aviso-filtro button{background:none;border:1px solid var(--gold);color:var(--gold);border-radius:6px;padding:3px 10px;font-family:inherit;font-size:11px;cursor:pointer}
.aviso-filtro button:hover{background:rgba(201,162,39,.18)}

/* ===== KPIs Y GRAFICOS ===== */
/* Rampa secuencial de un solo tono: la magnitud ya la codifica el largo de la
   barra, el color solo refuerza la progresion. Los 5 pasos estan validados a
   >=3:1 de contraste sobre --surface y con luminancia monotona creciente. */
:root{
  --s1:#006AFE;--s2:#3d8bff;--s3:#66a5ff;--s4:#8fbfff;--s5:#b8d8ff;
  --track:#12304e;
}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi-label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.kpi-main{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.kpi-value{font-size:32px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi-delta{font-size:12px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.kpi-up{color:var(--green)}.kpi-down{color:var(--red)}.kpi-flat{color:var(--text2)}
.kpi-sub{font-size:11px;color:var(--text2)}
.kpi-spark{margin-top:2px;height:28px;width:100%;display:block;overflow:visible}

.charts-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-bottom:16px}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;min-width:0}
.chart-title{font-size:13px;font-weight:600;margin-bottom:2px}
.chart-note{font-size:11px;color:var(--text2);margin-bottom:14px}
.chart-plot{position:relative}
.chart-svg{display:block;width:100%;height:150px;overflow:visible}
.chart-xaxis{position:relative;height:14px;margin-top:6px}
.chart-xlabel{position:absolute;top:0;white-space:nowrap;font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.4px}
.chart-hit{position:absolute;inset:0;display:flex}
.chart-hitcol{flex:1;cursor:default}

/* Barras horizontales en HTML: el texto no se deforma con el ancho y es
   responsive sin calculos, a diferencia de meter las etiquetas dentro del SVG. */
.hbar{display:grid;grid-template-columns:minmax(88px,132px) 1fr auto;align-items:center;gap:10px;padding:5px 0}
.hbar-label{font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar-track{background:var(--track);border-radius:4px;height:16px;overflow:hidden}
.hbar-fill{height:100%;border-radius:4px;min-width:3px;transition:filter .15s}
.hbar:hover .hbar-fill{filter:brightness(1.18)}
.hbar-value{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.hbar-pct{color:var(--text2);font-weight:400;font-size:11px}

.chart-tip{position:fixed;z-index:300;pointer-events:none;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12px;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.45);opacity:0;transition:opacity .12s;white-space:nowrap}
.chart-tip.show{opacity:1}
.chart-tip b{font-size:13px}

/* ===== CALIDAD DE DATOS ===== */
.q-intro{padding:16px 24px;color:var(--text2);font-size:13px;line-height:1.6;border-bottom:1px solid var(--border)}
.q-intro strong{color:var(--text)}
.q-block{padding:0 0 8px}
.q-title{padding:16px 24px 10px;font-size:14px;font-weight:600;letter-spacing:.3px}
.q-table td{white-space:nowrap;max-width:none}
.q-field{font-weight:500}
.q-total{display:block;font-weight:400;color:var(--text2);text-transform:none;letter-spacing:0;font-size:10px;margin-top:2px}
.q-cell{text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.q-bad{color:#ff5c7a;background:rgba(255,92,122,.10)}
.q-mid{color:var(--gold);background:rgba(201,162,39,.10)}
.q-ok{color:#2ecc8f;background:rgba(46,204,143,.10)}

/* ===== NOTES ===== */
.note-btn{background:none;border:none;cursor:pointer;font-size:14px;padding:2px 4px;opacity:.4;transition:opacity .2s}
.note-btn:hover{opacity:1}
.note-btn.has-note{opacity:.9;filter:drop-shadow(0 0 3px var(--gold))}
.note-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center}
.note-modal-overlay.show{display:flex}
.note-modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:480px;animation:lemaIn .2s ease-out}
.note-modal h3{font-size:15px;margin-bottom:4px}
.note-modal .note-who{font-size:12px;color:var(--text2);margin-bottom:12px}
.note-modal textarea{width:100%;min-height:100px;padding:12px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:inherit;font-size:14px;resize:vertical;outline:none}
.note-modal textarea:focus{border-color:var(--blue)}
.note-modal-actions{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
.note-modal-actions button{padding:8px 20px;border-radius:8px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;border:none}
.note-save{background:var(--blue);color:#fff}
.note-cancel{background:var(--surface2);color:var(--text2);border:1px solid var(--border) !important}

/* ===== BADGES ===== */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.3px}
.badge-blue{background:rgba(0,106,254,.15);color:#4d9aff}
.badge-cyan{background:rgba(1,201,226,.15);color:var(--cyan)}
.badge-gold{background:rgba(201,162,39,.15);color:var(--gold)}
.badge-green{background:rgba(0,182,122,.15);color:var(--green)}
.badge-red{background:rgba(255,71,87,.15);color:var(--red)}
.badge-gray{background:rgba(136,153,170,.15);color:var(--text2)}
.badge-purple{background:rgba(155,89,255,.15);color:#b388ff}

/* ===== LOADING ===== */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 0;gap:16px}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:var(--text2);font-size:14px}

/* ===== ERROR ===== */
.error-banner{background:rgba(255,71,87,.1);border:1px solid rgba(255,71,87,.3);border-radius:var(--radius);padding:16px 24px;margin-bottom:16px;color:var(--red);font-size:14px;display:none}

#dashboardApp{display:none}
.note-nombre{margin:10px 0 0;width:100%}

/* ===== RESPONSIVE ===== */
@media(max-width:1024px){
  .metrics-grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:768px){
  .header{padding:10px 16px;flex-direction:column;gap:10px}
  .header-right{justify-content:center;width:100%}
  .container{padding:16px}
  .metrics-grid{grid-template-columns:repeat(2,1fr)}
  .metric-value{font-size:22px}
  .filters-bar{flex-direction:column;align-items:stretch}
  .filter-select,.filter-date,.multi-select{min-width:100%;width:100%}
  .multi-select-btn{width:100%}
  .table-header{flex-direction:column;align-items:flex-start}
  .lema-text{font-size:12px;letter-spacing:1.5px}
}
@media(max-width:480px){
  .metrics-grid{grid-template-columns:1fr}
  .tabs{gap:2px}
  .tab{padding:8px 14px;font-size:13px}
  .logo-img{height:24px}
  .header-right{gap:8px}
  .user-badge{font-size:11px;padding:4px 10px}
}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <img src="logo.png" alt="Start Companies" class="login-logo-img">
    <div class="login-title">Dashboard</div>
    <div class="login-sub">Ingresa la contraseña para acceder</div>
    <form onsubmit="handleLogin(event)">
      <input class="login-input" type="password" id="loginPass" placeholder="Contraseña" autocomplete="current-password" required autofocus>
      <button class="login-btn" type="submit">Iniciar Sesion</button>
    </form>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- ===== DASHBOARD ===== -->
<div id="dashboardApp">
  <div class="header">
    <div class="logo">
      <img src="logo.png" alt="Start Companies" class="logo-img">
    </div>

<script>
// ===== AUTH =====
// La validacion de la clave pasa en el servidor (netlify/functions/auth.js).
// Antes esta pagina traia la tabla de hashes y decidia sola si mostrar el panel,
// mientras los endpoints de datos no pedian nada: la base se bajaba con un curl.
// Entrar pide solo la contrasena. El nombre, que se usa para firmar las notas, se
// pregunta recien al escribir una y queda guardado en el navegador.
let TOKEN=null;

function nombreGuardado(){return localStorage.getItem('sc_nombre')||''}

async function handleLogin(e){
  e.preventDefault();
  const err=document.getElementById('loginError');
  const pass=document.getElementById('loginPass').value;
  err.textContent='Verificando...';
  try{
    const r=await fetch('/.netlify/functions/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pass})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){err.textContent=j.error||'Contraseña incorrecta';return}
    TOKEN=j.token;
    localStorage.setItem('sc_user',JSON.stringify({token:j.token,expires:Date.now()+(j.expiraEn||0)}));
    err.textContent='';
    showDashboard();
  }catch(ex){err.textContent='No se pudo conectar: '+ex.message}
}

function handleLogout(){localStorage.removeItem('sc_user');TOKEN=null;location.reload()}

function showDashboard(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('dashboardApp').style.display='block';
  const badge=document.getElementById('userBadge');
  const n=nombreGuardado();
  badge.textContent=n;
  badge.style.display=n?'':'none';
  fetchData();
}

// Sesion caida o token vencido: volver al login en vez de mostrar una pantalla vacia.
function sesionVencida(msg){
  localStorage.removeItem('sc_user');TOKEN=null;
  document.getElementById('dashboardApp').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('loginError').textContent=msg||'Tu sesion vencio, volve a entrar';
}

function authHeaders(extra){
  return Object.assign({'Authorization':'Bearer '+(TOKEN||'')},extra||{});
}

(function(){
  try{
    const raw=localStorage.getItem('sc_user');
    if(!raw)return;
    const s=JSON.parse(raw);
    if(!s.token||Date.now()>s.expires){localStorage.removeItem('sc_user');return}
    TOKEN=s.token;
    showDashboard();
  }catch(e){localStorage.removeItem('sc_user')}
})();

// ===== STATE =====
let DATA=null, currentTab='leads', filters={};
const TITLES={leads:'Lead Totales y Flujos',llcs:'LLCs Apertura Mes Actual',seguimientos:'Seguimientos',calidad:'Calidad de Datos'};
const TABS=['leads','llcs','seguimientos','calidad'];

// ===== DATE HELPERS =====
function parseDate(str){if(!str)return null;const d=new Date(str);return isNaN(d)?null:d}
function isToday(d){if(!d)return false;const t=new Date();return d.toDateString()===t.toDateString()}
function isThisWeek(d){if(!d)return false;const now=new Date(),start=new Date(now);start.setDate(now.getDate()-now.getDay());start.setHours(0,0,0,0);return d>=start&&d<=now}

// ===== MATCHING HELPERS =====
function normEmail(e){return(e||'').trim().toLowerCase()}
function pct(a,b){return b?Math.round(a/b*100):0}
function isJunkCanal(c){const l=(c||'').toLowerCase();return l.includes('timelines')||l.includes('+1786')||l.includes('+1789')||l==='otro'||l.includes('no se asign')}
let collapsedSections=null;
function initCollapsed(){if(!collapsedSections)collapsedSections={}}
function mSection(id,title,content){
  initCollapsed();
  const isCol=collapsedSections[id]!==false;// default collapsed
  return `<div class="metrics-row-title" onclick="toggleSection('${id}')"><span class="toggle-arrow${isCol?' collapsed':''}">\u25BC</span>${title}</div><div class="metrics-group${isCol?' collapsed':''}" id="mg_${id}">${content}</div>`;
}
function toggleSection(id){
  initCollapsed();
  collapsedSections[id]=collapsedSections[id]===false?true:false;
  const el=document.getElementById('mg_'+id);
  const arrow=el.previousElementSibling.querySelector('.toggle-arrow');
  el.classList.toggle('collapsed');
  arrow.classList.toggle('collapsed');
}

// ===== VENTANA ACTUAL VS ANTERIOR =====
// Un numero suelto no dice nada; lo que importa es contra que se compara.
// La ventana anterior es del mismo largo, pegada hacia atras.
function ventanaActual(){
  if(!filters.desde||!filters.hasta)return null;
  return{desde:boundDate(filters.desde,false),hasta:boundDate(filters.hasta,true)};
}
function ventanaAnterior(){
  const v=ventanaActual();if(!v)return null;
  const largo=v.hasta-v.desde;
  return{desde:new Date(v.desde.getTime()-largo-1),hasta:new Date(v.desde.getTime()-1)};
}
function enVentana(rows,v,campoFecha){
  if(!v)return rows;
  return rows.filter(r=>{const d=parseDate(r[campoFecha||'Fecha']);return d&&d>=v.desde&&d<=v.hasta});
}

// ===== SERIES MENSUALES (para los sparklines y la tendencia) =====
function claveMes(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function serieMensual(rows,campoFecha,filtro){
  const m={};
  rows.forEach(r=>{
    if(filtro&&!filtro(r))return;
    const d=parseDate(r[campoFecha||'Fecha']);if(!d)return;
    const k=claveMes(d);m[k]=(m[k]||0)+1;
  });
  return Object.keys(m).sort().map(k=>({mes:k,valor:m[k]}));
}

// ===== EMBUDO =====
// Los cinco escalones que ya calculaba el resumen, en un solo lugar para que el
// grafico y las tarjetas no puedan contradecirse.
// El embudo llega hasta SQL y no hasta "LLC abierta" a proposito: al convertirse,
// Zoho saca el lead del modulo Leads, asi que los leads que leemos son justamente
// los que NO convirtieron. De 293 LLCs en la misma ventana, exactamente 1 cruza
// con un lead por mail. El paso Lead -> LLC no es medible con estos dos datasets
// (contra Seguimientos el mismo cruce anda: 432 de 490), asi que mostrarlo era
// inventar un numero. Las LLCs se cuentan aparte, como metrica propia.
function calcularEmbudo(rows){
  const total=rows.length;
  const agendo=rows.filter(r=>r['¿Agendó?']==='Sí').length;
  // Sale de los Events del propio lead, misma ventana y sin depender de que el
  // lead tenga mail cargado. Cruzarlo contra Seguimientos hacia subir el embudo.
  const asistio=rows.filter(r=>r['Estado del meeting']==='Asistió').length;
  const sql=rows.filter(r=>(r['Calificación']||r['Calificacion']||'').toLowerCase().includes('sql calificado')).length;
  return[
    {etapa:'Leads',valor:total},
    {etapa:'Agendaron',valor:agendo},
    {etapa:'Asistieron',valor:asistio},
    {etapa:'SQL Calificado',valor:sql}
  ];
}

// ===== PIEZAS VISUALES =====
const RAMPA=['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)'];

function deltaHTML(actual,previo){
  if(previo===null||previo===undefined)return'';
  if(!previo)return`<span class="kpi-delta kpi-flat">sin base previa</span>`;
  const v=Math.round((actual-previo)/previo*100);
  const cl=v>0?'kpi-up':v<0?'kpi-down':'kpi-flat';
  const flecha=v>0?'▲':v<0?'▼':'▬';
  return`<span class="kpi-delta ${cl}">${flecha} ${v>0?'+':''}${v}%</span>`;
}

// Sparkline: contexto, no lectura precisa. Sin ejes ni etiquetas a proposito.
function sparklineSVG(serie){
  if(!serie||serie.length<2)return'';
  const w=100,h=28,vals=serie.map(p=>p.valor);
  const max=Math.max(...vals),min=Math.min(...vals),rango=(max-min)||1;
  const x=i=>i/(serie.length-1)*w;
  const y=v=>h-2-((v-min)/rango)*(h-6);
  const linea=serie.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.valor).toFixed(1)}`).join(' ');
  const area=`${linea} L${w},${h} L0,${h} Z`;
  const ult=serie[serie.length-1];
  return`<svg class="kpi-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${area}" fill="var(--s1)" opacity=".16"/>
    <path d="${linea}" fill="none" stroke="var(--s2)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(serie.length-1).toFixed(1)}" cy="${y(ult.valor).toFixed(1)}" r="2.5" fill="var(--s3)" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

function kpiTile(label,valor,sub,delta,serie){
  return`<div class="kpi-tile">
    <div class="kpi-label">${esc(label)}</div>
    <div class="kpi-main"><span class="kpi-value">${valor}</span>${delta||''}</div>
    ${sub?`<div class="kpi-sub">${sub}</div>`:''}
    ${serie?sparklineSVG(serie):''}
  </div>`;
}

// Barras horizontales. Un solo tono salvo que se pase una rampa (embudo).
function barrasHTML(items,opts){
  const o=opts||{};
  if(!items.length)return'<div class="kpi-sub">Sin datos en el per&iacute;odo</div>';
  const max=Math.max(...items.map(i=>i.valor))||1;
  return items.map((it,i)=>{
    const color=o.rampa?RAMPA[Math.min(i,RAMPA.length-1)]:'var(--s2)';
    const pct=o.pctSobre?pct2(it.valor,o.pctSobre):null;
    return`<div class="hbar" data-tip="${esc(it.tip||(it.etiqueta+': '+it.valor))}">
      <div class="hbar-label" title="${esc(it.etiqueta)}">${esc(it.etiqueta)}</div>
      <div class="hbar-track"><div class="hbar-fill" style="width:${(it.valor/max*100).toFixed(1)}%;background:${color}"></div></div>
      <div class="hbar-value">${it.valor}${o.sufijo||''}${pct!==null?` <span class="hbar-pct">${pct}%</span>`:''}</div>
    </div>`;
  }).join('');
}
function pct2(a,b){return b?Math.round(a/b*100):0}

// Linea de tendencia. Las etiquetas del eje van en HTML debajo, no dentro del
// SVG: metidas adentro se estiran con el ancho del contenedor.
function tendenciaHTML(serie,titulo,nota){
  if(!serie||serie.length<2)return'';
  const w=600,h=150,pad=8;
  const vals=serie.map(p=>p.valor);
  const max=Math.max(...vals)||1;
  const x=i=>pad+i/(serie.length-1)*(w-pad*2);
  const y=v=>h-16-(v/max)*(h-32);
  const linea=serie.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.valor).toFixed(1)}`).join(' ');
  const area=`${linea} L${x(serie.length-1).toFixed(1)},${h-16} L${x(0).toFixed(1)},${h-16} Z`;
  const puntos=serie.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.valor).toFixed(1)}" r="4" fill="var(--s3)" stroke="var(--surface)" stroke-width="2"/>`).join('');
  const hits=serie.map(p=>`<div class="chart-hitcol" data-tip="${esc(mesLargo(p.mes)+': '+p.valor+' leads')}"></div>`).join('');
  // Las etiquetas se posicionan con la MISMA cuenta que los puntos. Con columnas
  // de ancho igual quedaban corridas: el primer punto va pegado al borde y su
  // etiqueta caia centrada en la primera columna.
  const ejes=serie.map((p,i)=>{
    const izq=(x(i)/w*100).toFixed(2);
    const t=i===0?'none':i===serie.length-1?'translateX(-100%)':'translateX(-50%)';
    return`<div class="chart-xlabel" style="left:${izq}%;transform:${t}">${mesLabel(p.mes)}</div>`;
  }).join('');
  return`<div class="chart-card">
    <div class="chart-title">${esc(titulo)}</div>
    <div class="chart-note">${esc(nota||'')}</div>
    <div class="chart-plot">
      <svg class="chart-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        <line x1="${pad}" y1="${h-16}" x2="${w-pad}" y2="${h-16}" stroke="var(--border)" stroke-width="1" vector-effect="non-scaling-stroke"/>
        <path d="${area}" fill="var(--s1)" opacity=".16"/>
        <path d="${linea}" fill="none" stroke="var(--s2)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
        ${puntos}
      </svg>
      <div class="chart-hit">${hits}</div>
    </div>
    <div class="chart-xaxis">${ejes}</div>
  </div>`;
}
function mesLargo(k){const p=k.split('-');return MES_CORTO[parseInt(p[1],10)-1]+' '+p[0]}

// ===== TOOLTIP =====
// Un solo nodo reutilizado para todo lo que tenga data-tip.
(function(){
  let tip=null;
  function nodo(){
    if(!tip){tip=document.createElement('div');tip.className='chart-tip';document.body.appendChild(tip)}
    return tip;
  }
  document.addEventListener('mousemove',e=>{
    const t=e.target.closest&&e.target.closest('[data-tip]');
    const n=nodo();
    if(!t){n.classList.remove('show');return}
    n.innerHTML=t.getAttribute('data-tip');
    n.classList.add('show');
    const r=n.getBoundingClientRect();
    let x=e.clientX+14,y=e.clientY-r.height-10;
    if(x+r.width>window.innerWidth-8)x=e.clientX-r.width-14;
    if(y<8)y=e.clientY+18;
    n.style.left=x+'px';n.style.top=y+'px';
  });
})();

// ===== LECTURA DEL PERIODO =====
// El panel mostraba cuentas, y con cuentas no se decide nada. Esto arma en texto
// que paso y donde esta la tension, con reglas explicitas sobre los mismos
// numeros que se ven abajo. No dice nada que no salga de los datos.
function esSQL(r){return(r['Calificación']||r['Calificacion']||'').toLowerCase().includes('sql calificado')}
function diasDesde(fecha){
  const d=parseDate(fecha);if(!d)return 9999;
  return Math.floor((Date.now()-d.getTime())/86400000);
}
function variacion(actual,previo){
  if(previo===null||previo===undefined||!previo)return null;
  return Math.round((actual-previo)/previo*100);
}
function frase(v,masEsMejor){
  if(v===null)return'';
  if(v===0)return'igual que el período anterior';
  const dir=v>0?'más':'menos';
  return`${Math.abs(v)}% ${dir} que el período anterior`;
}

function lecturaDelPeriodo(rows,allLLCs){
  if(!rows.length)return'';
  const prev=ventanaAnterior();
  // Con "Todo el período" no hay contra qué comparar, pero igual se redacta la
  // lectura sin variaciones: dejarla vacía era peor que no tener comparación.
  const pr=prev?enVentana(DATA.leads,prev):[];
  const hayComparacion=pr.length>0;

  const sql=rows.filter(esSQL).length, pSql=pr.filter(esSQL).length;
  const ns=rows.filter(r=>r['Estado del meeting']==='No Asistió').length;
  const pNs=pr.filter(r=>r['Estado del meeting']==='No Asistió').length;
  const vLeads=hayComparacion?variacion(rows.length,pr.length):null;
  const vSql=hayComparacion?variacion(sql,pSql):null;
  const vNs=hayComparacion?variacion(ns,pNs):null;

  const partes=[];
  partes.push(`Entraron <b>${rows.length} leads</b>${vLeads!==null?', '+frase(vLeads):''}.`);

  // La tension que importa: mas volumen con menos calificados es peor, no mejor.
  if(vLeads!==null&&vSql!==null&&vLeads>5&&vSql<-5){
    partes.push(`Pero los <b>SQL bajaron ${Math.abs(vSql)}%</b> (${sql} contra ${pSql}): entra más gente y califica menos.`);
  }else if(vSql!==null&&vSql>5){
    partes.push(`Los <b>SQL subieron ${vSql}%</b> (${sql} contra ${pSql}).`);
  }else{
    partes.push(`Quedaron <b>${sql} SQL calificados</b>${vSql!==null?', '+frase(vSql):''}.`);
  }

  if(ns){
    partes.push(`Hubo <b>${ns} no-shows</b>${vNs!==null?', '+frase(vNs):''}.`);
  }

  // Canal que califica y canal que trae volumen sin calificar: la decision de
  // presupuesto sale de comparar esos dos.
  const porCanal={};
  rows.forEach(r=>{const c=r['Canal']||'Otro';if(isJunkCanal(c))return;
    if(!porCanal[c])porCanal[c]={n:0,sql:0};porCanal[c].n++;if(esSQL(r))porCanal[c].sql++});
  const conVolumen=Object.entries(porCanal).filter(([,v])=>v.n>=20);
  if(conVolumen.length>=2){
    const mejor=conVolumen.slice().sort((a,b)=>pct2(b[1].sql,b[1].n)-pct2(a[1].sql,a[1].n))[0];
    const secos=conVolumen.filter(([,v])=>v.sql===0).sort((a,b)=>b[1].n-a[1].n);
    if(mejor[1].sql>0){
      partes.push(`El canal que más califica es <b>${esc(mejor[0])}</b> (${mejor[1].sql} SQL de ${mejor[1].n} leads, ${pct2(mejor[1].sql,mejor[1].n)}%).`);
    }
    if(secos.length){
      const listados=secos.slice(0,2);
      const lista=listados.map(([c,v])=>`${esc(c)} (${v.n})`).join(' y ');
      const verbo=listados.length>1?'trajeron':'trajo';   // concuerda con cuantos canales se nombran
      partes.push(`<span class="lectura-alerta">${lista} ${verbo} volumen y <b>ningún SQL</b>.</span>`);
    }
  }

  return`<div class="lectura">
    <div class="lectura-titulo">Lectura del período</div>
    <p class="lectura-texto">${partes.join(' ')}</p>
  </div>`;
}

// ===== ALERTAS ACCIONABLES =====
// Cada una es una cosa que alguien tiene que hacer, con su lista detras: al
// clickearla filtra la tabla y te deja los registros exactos.
const ALERTAS=[
  {id:'sql_sin_dueno',tab:'leads',tono:'red',
   titulo:'SQL sin vendedor asignado',accion:'Leads calificados que no tiene nadie. Asignalos.',
   test:r=>esSQL(r)&&r['Vendedor asignado']===OWNER_GENERICO},
  {id:'llc_trabada',tab:'llcs',tono:'red',
   titulo:'Aperturas trabadas hace +30 días',accion:'En documentación o filing, sin avanzar.',
   test:r=>{const e=(r['Etapa']||'').toLowerCase();
     return(e.includes('filing')||e.includes('documentaci'))&&diasDesde(r['Fecha'])>30}},
  {id:'noshow_reciente',tab:'leads',tono:'gold',
   titulo:'No asistieron en los últimos 14 días',accion:'Reagendá antes de que se enfríen.',
   test:r=>r['Estado del meeting']==='No Asistió'&&diasDesde(r['Fecha'])<=14},
  {id:'meeting_sin_estado',tab:'leads',tono:'gold',
   titulo:'Meetings sin resultado cargado',accion:'El vendedor no marcó si asistió. Últimos 14 días.',
   test:r=>r['¿Agendó?']==='Sí'&&r['Estado del meeting']==='Sin información'&&diasDesde(r['Fecha'])<=14},
  {id:'seg_sql',tab:'seguimientos',tono:'cyan',
   titulo:'Seguimientos marcados SQL',accion:'Calificados esperando cierre.',
   test:r=>(r['Estatus del Lead']||'').toLowerCase().includes('sql calificado')}
];

function datasetDe(tab){
  if(!DATA)return[];
  return tab==='leads'?DATA.leads:tab==='llcs'?DATA.llcs:DATA.seguimientos;
}

// ===== COMPARADOR DE CANALES =====
// La tabla con la que se decide presupuesto: volumen contra calidad, lado a lado.
function comparadorCanales(rows){
  const m={};
  rows.forEach(r=>{
    const c=r['Canal']||'Otro';if(isJunkCanal(c))return;
    if(!m[c])m[c]={n:0,sql:0,ns:0,meet:0};
    m[c].n++;
    if(esSQL(r))m[c].sql++;
    if(r['Estado del meeting']==='No Asistió'){m[c].ns++;m[c].meet++}
    else if(r['Estado del meeting']==='Asistió')m[c].meet++;
  });
  const filas=Object.entries(m).filter(([,v])=>v.n>=5).sort((a,b)=>b[1].n-a[1].n);
  if(!filas.length)return'';
  const maxSql=Math.max(...filas.map(([,v])=>pct2(v.sql,v.n)));
  return`<div class="chart-card">
    <div class="chart-title">Comparador de canales</div>
    <div class="chart-note">Volumen contra calidad. Canales con 5 leads o más en el período.</div>
    <div class="table-scroll"><table class="comp-table"><thead><tr>
      <th>Canal</th><th class="num">Leads</th><th class="num">SQL</th><th class="num">% SQL</th><th class="num">No-show</th>
    </tr></thead><tbody>
    ${filas.map(([c,v])=>{
      const p=pct2(v.sql,v.n);
      const cl=v.sql===0?'comp-cero':p>=maxSql&&maxSql>0?'comp-mejor':'';
      return`<tr class="${cl}"><td>${esc(c)}</td><td class="num">${v.n}</td><td class="num">${v.sql}</td>
        <td class="num"><b>${p}%</b></td><td class="num">${v.meet?pct2(v.ns,v.meet)+'%':'—'}</td></tr>`;
    }).join('')}
    </tbody></table></div>
  </div>`;
}

// ===== RENDIMIENTO POR LANDING =====
// La pregunta de siempre es "cual landing trae mejor gente", y hasta ahora habia
// que abrir la tabla para contestarla. Solo entran las que tienen landing real:
// los de WhatsApp nunca pasaron por una, y meterlos ensuciaria la comparacion.
function rendimientoLandings(rows){
  const m={};
  rows.forEach(r=>{
    const l=r['Landing Origen'];
    if(!l||l===SIN_DATO)return;
    if(!m[l])m[l]={n:0,sql:0,ag:0,dudoso:0};
    m[l].n++;
    if(esSQL(r))m[l].sql++;
    if(r['¿Agendó?']==='Sí')m[l].ag++;
    if(/confirmar/i.test(r['Origen del dato']||''))m[l].dudoso++;
  });
  const filas=Object.entries(m).filter(([,v])=>v.n>=3).sort((a,b)=>b[1].n-a[1].n);
  if(!filas.length)return'';
  const mejor=Math.max(...filas.map(([,v])=>pct2(v.sql,v.n)));
  const totalConLanding=filas.reduce((s,[,v])=>s+v.n,0);
  return`<div class="chart-card">
    <div class="chart-title">Rendimiento por landing</div>
    <div class="chart-note">${totalConLanding} leads con landing identificada en el per&iacute;odo. Con 3 o m&aacute;s leads cada una.</div>
    <div class="table-scroll"><table class="comp-table"><thead><tr>
      <th>Landing</th><th class="num">Leads</th><th class="num">Agend&oacute;</th><th class="num">SQL</th><th class="num">% SQL</th>
    </tr></thead><tbody>
    ${filas.map(([l,v])=>{
      const p=pct2(v.sql,v.n);
      const cl=v.sql===0?'comp-cero':p>=mejor&&mejor>0?'comp-mejor':'';
      const marca=v.dudoso===v.n?' <span class="badge badge-gold" title="Deducido del calendario usado, conviene confirmarlo">?</span>':'';
      return`<tr class="${cl}"><td>${esc(l)}${marca}</td><td class="num">${v.n}</td><td class="num">${v.ag}</td>
        <td class="num">${v.sql}</td><td class="num"><b>${p}%</b></td></tr>`;
    }).join('')}
    </tbody></table></div>
  </div>`;
}

// ===== METRICS =====
// Month-over-month view. Always computed over the FULL leads dataset (not the
// active period filter), so it stays comparable no matter what is selected.
const MES_CORTO=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
function renderComparativaMensual(allLeads){
  if(!allLeads||!allLeads.length)return'';
  const map={};
  allLeads.forEach(r=>{
    const d=parseDate(r['Fecha']);if(!d)return;
    const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    if(!map[k])map[k]={total:0,agendo:0,sql:0,noShow:0};
    const e=map[k];e.total++;
    if(r['¿Agendó?']==='Sí')e.agendo++;
    const c=(r['Calificación']||r['Calificacion']||'').toLowerCase();
    if(c.includes('sql calificado'))e.sql++;
    if(c.includes('no show'))e.noShow++;
  });
  // Only months fully inside the window are comparable: anything before it (or a
  // partial first month, if the window starts mid-month) would show a fake drop.
  let keys=Object.keys(map).sort();
  if(DATA&&DATA.leadsSince){
    const s=new Date(DATA.leadsSince);
    let first=s.getUTCFullYear()+'-'+String(s.getUTCMonth()+1).padStart(2,'0');
    if(s.getUTCDate()!==1){const n=new Date(Date.UTC(s.getUTCFullYear(),s.getUTCMonth()+1,1));first=n.getUTCFullYear()+'-'+String(n.getUTCMonth()+1).padStart(2,'0')}
    keys=keys.filter(k=>k>=first);
  }
  if(keys.length<2)return'';
  const cards=keys.map((k,i)=>{
    const d=map[k],prev=i>0?map[keys[i-1]]:null;
    const parts=k.split('-');
    const label=MES_CORTO[parseInt(parts[1],10)-1]+' '+parts[0];
    let delta='',cls='';
    if(prev&&prev.total){
      const v=Math.round((d.total-prev.total)/prev.total*100);
      delta=(v>0?'▲ +':v<0?'▼ ':'')+v+'% vs mes ant.';
      cls=v>0?' green':v<0?' red':'';
    }
    return `<div class="metric-card${cls}"><div class="metric-label">${label}${delta?' · '+delta:''}</div>
      <div class="metric-value">${d.total}</div>
      <div class="metric-sub">${d.agendo} agendaron (${pct(d.agendo,d.total)}%) · ${d.sql} SQL · ${d.noShow} no show</div></div>`;
  }).join('');
  return mSection('l_meses','Comparativa Mensual (leads)',`<div class="metrics-grid">${cards}</div>`);
}

// Cabecera de la solapa de leads: lo que tiene que entenderse sin hacer un clic.
function renderCabeceraLeads(rows,allLLCs,allSeguimientos){
  const emb=calcularEmbudo(rows);
  const total=emb[0].valor,agendo=emb[1].valor,asistio=emb[2].valor,sql=emb[3].valor;
  // Metrica propia, no un paso del embudo: las LLCs del periodo se cuentan por su
  // fecha, no cruzandolas con los leads (ese cruce no existe, ver calcularEmbudo).
  const llc=enVentana(allLLCs||[],ventanaActual()).length;

  // Mismas cuentas sobre la ventana inmediatamente anterior, para los deltas.
  const prev=ventanaAnterior();
  let pTotal=null,pAgendoTasa=null,pAsistio=null,pSql=null,pLlc=null;
  if(prev){
    const pr=enVentana(DATA.leads,prev);
    const pe=calcularEmbudo(pr);
    pTotal=pe[0].valor;
    pAgendoTasa=pct(pe[1].valor,pe[0].valor);
    pAsistio=pe[2].valor;
    pSql=pe[3].valor;
    pLlc=enVentana(allLLCs||[],prev).length;
  }

  const serieLeads=serieMensual(DATA.leads);
  const serieSQL=serieMensual(DATA.leads,'Fecha',r=>(r['Calificación']||'').toLowerCase().includes('sql calificado'));
  const serieAsistio=serieMensual(DATA.leads,'Fecha',r=>r['Estado del meeting']==='Asistió');
  const serieLLC=serieMensual(DATA.llcs||[]);
  const tasa=pct(agendo,total);

  const kpis=`<div class="kpi-row">
    ${kpiTile('Leads',total,'en el per&iacute;odo elegido',deltaHTML(total,pTotal),serieLeads)}
    ${kpiTile('Tasa de agendamiento',tasa+'%','⚠ '+agendo+' de '+total+'. Ver la nota del embudo',deltaHTML(tasa,pAgendoTasa),null)}
    ${kpiTile('Asistieron',asistio,pct(asistio,agendo)+'% de los que agendaron',deltaHTML(asistio,pAsistio),serieAsistio)}
    ${kpiTile('SQL Calificados',sql,pct(sql,total)+'% de los leads',deltaHTML(sql,pSql),serieSQL)}
    ${kpiTile('LLCs abiertas',llc,'en el per&iacute;odo, medidas aparte',deltaHTML(llc,pLlc),serieLLC)}
  </div>`;

  // Embudo: barras horizontales con el % de paso respecto del escalon anterior,
  // que es la pregunta real ("donde se cae la gente"), no el % sobre el total.
  const embudoItems=emb.map((e,i)=>({
    etiqueta:e.etapa,
    valor:e.valor,
    tip:`<b>${e.etapa}: ${e.valor}</b>`+(i?`<br>${pct2(e.valor,emb[i-1].valor)}% de ${emb[i-1].etapa.toLowerCase()}`:'')
  }));
  const embudo=`<div class="chart-card">
    <div class="chart-title">Embudo</div>
    <div class="chart-note">Cada barra, sobre el total de leads. Llega hasta SQL porque Zoho saca al lead del m&oacute;dulo cuando se convierte en LLC.<br>
    <span style="color:var(--gold)">&#9888; &laquo;Agendaron&raquo; todav&iacute;a no es una conversi&oacute;n real: quien agenda entra como un registro nuevo (Landing Page / Web Org&aacute;nica) en vez de marcarse sobre su lead de WhatsApp o Meta. Por eso los canales dan 0% o 100% y nunca algo en el medio.</span></div>
    ${barrasHTML(embudoItems,{rampa:true,pctSobre:total})}
  </div>`;

  // Canales: magnitud sobre un mismo eje, un solo tono. Los canales basura
  // (herramientas, numeros sueltos) quedan afuera para no ensuciar la lectura.
  const cuenta={};
  rows.forEach(r=>{const c=r['Canal']||'Otro';if(!isJunkCanal(c))cuenta[c]=(cuenta[c]||0)+1});
  const canales=Object.entries(cuenta).sort((a,b)=>b[1]-a[1]).slice(0,7)
    .map(([c,n])=>{
      const ag=rows.filter(r=>r['Canal']===c&&r['¿Agendó?']==='Sí').length;
      return{etiqueta:c,valor:n,tip:`<b>${esc(c)}: ${n} leads</b><br>${ag} agendaron (${pct2(ag,n)}%)`};
    });
  const porCanal=`<div class="chart-card">
    <div class="chart-title">Leads por canal</div>
    <div class="chart-note">Pas&aacute; el mouse para ver cu&aacute;ntos agendaron</div>
    ${barrasHTML(canales,{pctSobre:total})}
  </div>`;

  // Texto plano: tendenciaHTML lo pasa por esc(), asi que una entidad HTML se
  // veria literal ("hist&oacute;rico").
  const tendencia=tendenciaHTML(serieLeads,'Leads por mes','Sobre todo el histórico cargado, sin importar el filtro de período');

  return lecturaDelPeriodo(rows,allLLCs)+renderAlertas()+kpis+
    `<div class="charts-row">${tendencia}${embudo}${porCanal}</div>`+
    `<div class="charts-row">${comparadorCanales(rows)}${rendimientoLandings(rows)}</div>`;
}

function updateMetrics(){
  if(!DATA)return;
  const el=document.getElementById('metricsSection');
  const rows=getFilteredRows();
  if(currentTab==='calidad') el.innerHTML=renderMetricsCalidad();
  else if(currentTab==='leads') el.innerHTML=renderMetricsLeads(rows,DATA.llcs,DATA.seguimientos);
  else if(currentTab==='llcs') el.innerHTML=renderMetricsLLCs(rows,DATA.leads);
  else el.innerHTML=renderMetricsSeguimientos(rows);
}

function renderMetricsLeads(rows, allLLCs, allSeguimientos){
  // La cabecera (KPIs, embudo, tendencia, comparadores) ya cuenta todo. Las
  // secciones colapsables viejas se sacaron: duplicaban esos mismos numeros con
  // nombres de canal que ya no existen ("Meta Form", "Landing Page 0") y varias
  // calculaban sobre denominadores que dejaron de ser validos al reconstruir los
  // datasets. Queda solo la comparativa mensual, que no esta en ningun otro lado.
  return renderCabeceraLeads(rows,allLLCs,allSeguimientos)+renderComparativaMensual(DATA&&DATA.leads);
}

function renderMetricsLLCs(rows, allLeads){
  const total=rows.length;
  const et=e=>rows.filter(r=>(r['Etapa']||'')===e).length;
  // "Confirmadas" mezclaba Apertura Confirmada (1) con Cuenta Bancaria Confirmada
  // (129), que son dos cosas distintas. Se cuentan por separado.
  const activas=et('Apertura Activa');
  const enProceso=et('Documentación completada')+et('Filing Iniciado')+et('Apertura Cuenta Bancaria');
  const bancaria=et('Cuenta Bancaria Confirmada')+et('Cuenta Bancaria Finalizada');
  const perdidas=et('Apertura Perdida')+et('Cuenta Bancaria Perdida');
  const conPago=rows.filter(r=>{const p=(r['Confirmación de pago']||'').toLowerCase();return p&&p!=='sin pago'}).length;

  const kpis=`<div class="kpi-row">
    ${kpiTile('LLCs',total,'en el período elegido','',serieMensual(rows))}
    ${kpiTile('Activas',activas,pct(activas,total)+'% del total','',null)}
    ${kpiTile('En proceso',enProceso,'documentación, filing o banco','',null)}
    ${kpiTile('Cuenta bancaria lista',bancaria,pct(bancaria,total)+'% del total','',null)}
    ${kpiTile('Con pago registrado',conPago,'⚠ '+pct(conPago,total)+'%. Ver Calidad de Datos','',null)}
  </div>`;

  // Etapas, de la más avanzada a la menos. Barras y no tarjetas: son partes de un
  // mismo total y así se comparan de un vistazo.
  const orden=['Cuenta Bancaria Finalizada','Cuenta Bancaria Confirmada','Apertura Cuenta Bancaria',
    'Apertura Activa','Filing Iniciado','Documentación completada','Apertura Confirmada',
    'Apertura Perdida','Cuenta Bancaria Perdida'];
  const etapas=orden.map(e=>({etiqueta:e,valor:et(e),tip:`<b>${e}: ${et(e)}</b><br>${pct(et(e),total)}% del total`}))
    .filter(x=>x.valor>0);
  const cardEtapas=`<div class="chart-card">
    <div class="chart-title">Etapas</div>
    <div class="chart-note">De la más avanzada a la menos, sobre ${total} LLCs</div>
    ${barrasHTML(etapas,{pctSobre:total})}
  </div>`;

  const cuenta={};
  rows.forEach(r=>{const c=r['Canal de Origen']||SIN_DATO;cuenta[c]=(cuenta[c]||0)+1});
  const canales=Object.entries(cuenta).sort((a,b)=>b[1]-a[1]).slice(0,8)
    .map(([c,n])=>({etiqueta:c,valor:n,tip:`<b>${esc(c)}: ${n}</b>`}));
  const cardCanal=`<div class="chart-card">
    <div class="chart-title">LLCs por canal</div>
    <div class="chart-note">Del registro histórico. No se puede recalcular: al convertirse, Zoho saca al lead del módulo</div>
    ${barrasHTML(canales,{pctSobre:total})}
  </div>`;

  const perdidasCard=perdidas?`<div class="chart-card">
    <div class="chart-title">Perdidas</div>
    <div class="chart-note">Aperturas y cuentas bancarias caídas</div>
    ${barrasHTML([{etiqueta:'Apertura Perdida',valor:et('Apertura Perdida')},{etiqueta:'Cuenta Bancaria Perdida',valor:et('Cuenta Bancaria Perdida')}].filter(x=>x.valor>0),{pctSobre:total})}
  </div>`:'';

  return kpis+`<div class="charts-row">${cardEtapas}${cardCanal}${perdidasCard}</div>`;
}

function renderMetricsSeguimientos(rows){
  // El error de la version vieja: contaba como "agendados" a todos, incluidos los
  // 1298 que nunca tuvieron meeting. Por eso los porcentajes daban tres veces mas
  // bajos de lo real (16% en vez de 45%).
  const CON_MEETING=['Asistió','No Asistió','Reagendó','Sin información'];
  const agendaron=rows.filter(r=>CON_MEETING.includes(r['Estado del Meeting']));
  const asistio=agendaron.filter(r=>r['Estado del Meeting']==='Asistió').length;
  const noShow=agendaron.filter(r=>r['Estado del Meeting']==='No Asistió').length;
  const reagendo=agendaron.filter(r=>r['Estado del Meeting']==='Reagendó').length;
  const sinCargar=agendaron.filter(r=>r['Estado del Meeting']==='Sin información').length;
  const sql=rows.filter(r=>(r['Estatus del Lead']||'').toLowerCase().includes('sql calificado')).length;
  const enRet=rows.filter(r=>(r['Retargeting']||'No')!=='No').length;

  const kpis=`<div class="kpi-row">
    ${kpiTile('Agendaron',agendaron.length,'de '+rows.length+' en seguimiento','',null)}
    ${kpiTile('Asistieron',asistio,pct(asistio,agendaron.length)+'% de los que agendaron','',null)}
    ${kpiTile('No asistieron',noShow,pct(noShow,agendaron.length)+'% de los que agendaron','',null)}
    ${kpiTile('SQL calificados',sql,pct(sql,rows.length)+'% del total','',null)}
    ${kpiTile('En retargeting',enRet,pct(enRet,rows.length)+'% del total','',null)}
  </div>`;

  const pendientes=sinCargar?`<div class="chart-card">
    <div class="chart-title">Meetings sin resultado cargado</div>
    <div class="chart-note">El vendedor no marcó si la persona asistió. Sin esto, el no-show real es más alto que el que ves.</div>
    ${barrasHTML([{etiqueta:'Sin cargar',valor:sinCargar},{etiqueta:'Con resultado',valor:agendaron.length-sinCargar}],{pctSobre:agendaron.length})}
  </div>`:'';

  // No-show por canal, sobre los que efectivamente agendaron. Antes el
  // denominador incluia a todos y daba, por ejemplo, Meta Ads 20% cuando es 47%.
  const m={};
  agendaron.forEach(r=>{
    const c=r['Canal de Origen']||SIN_DATO;
    if(isJunkCanal(c))return;
    if(!m[c])m[c]={n:0,ns:0};
    m[c].n++;
    if(r['Estado del Meeting']==='No Asistió')m[c].ns++;
  });
  const canales=Object.entries(m).filter(([,v])=>v.n>=3).sort((a,b)=>pct2(b[1].ns,b[1].n)-pct2(a[1].ns,a[1].n))
    .map(([c,v])=>({etiqueta:c,valor:pct2(v.ns,v.n),tip:`<b>${esc(c)}</b><br>${v.ns} no asistieron de ${v.n} que agendaron`}));
  const cardNS=canales.length?`<div class="chart-card">
    <div class="chart-title">No-show por canal</div>
    <div class="chart-note">Sobre los que agendaron, no sobre el total. Canales con 3 o más meetings.</div>
    ${barrasHTML(canales,{sufijo:'%'})}
  </div>`:'';

  // La palanca mas barata que hay: no cuesta un peso mas de pauta. Medido sobre
  // 448 reuniones, el no-show trepa de 35% a 60% segun cuanto falte para la
  // llamada, asi que acortar la ventana de agenda recupera gente sola.
  const ORDEN_ANT=['Menos de 6h','6 a 24h','1 a 2 días','2 a 4 días','Más de 4 días'];
  const a={};
  agendaron.forEach(r=>{
    const k=r['Anticipación'];if(!k)return;
    if(!a[k])a[k]={n:0,ns:0};a[k].n++;
    if(r['Estado del Meeting']==='No Asistió')a[k].ns++;
  });
  const antItems=ORDEN_ANT.filter(k=>a[k]&&a[k].n>=5).map(k=>({
    etiqueta:k,valor:pct2(a[k].ns,a[k].n),
    tip:`<b>${k}</b><br>${a[k].ns} no asistieron de ${a[k].n} reuniones`
  }));
  const cardAnt=antItems.length>=3?`<div class="chart-card">
    <div class="chart-title">Cu&aacute;nto antes reservan, m&aacute;s aparecen</div>
    <div class="chart-note">% de no-show seg&uacute;n cu&aacute;nto falta entre que reservan y la llamada. Acortar la ventana de agenda no cuesta pauta.</div>
    ${barrasHTML(antItems,{sufijo:'%'})}
  </div>`:'';

  // Mismo corte pero por landing: sirve para saber si hay una pagina que trae
  // gente que agenda y despues no aparece.
  const lg={};
  agendaron.forEach(r=>{
    const k=r['Landing Origen'];if(!k||k===SIN_DATO)return;
    if(!lg[k])lg[k]={n:0,ns:0};lg[k].n++;
    if(r['Estado del Meeting']==='No Asistió')lg[k].ns++;
  });
  const lgItems=Object.entries(lg).filter(([,v])=>v.n>=5).sort((x,y)=>pct2(y[1].ns,y[1].n)-pct2(x[1].ns,x[1].n))
    .map(([k,v])=>({etiqueta:k,valor:pct2(v.ns,v.n),tip:`<b>${esc(k)}</b><br>${v.ns} no asistieron de ${v.n}`}));
  const cardLanding=lgItems.length?`<div class="chart-card">
    <div class="chart-title">No-show por landing</div>
    <div class="chart-note">Landings con 5 o m&aacute;s reuniones. Sirve para ver si hay una p&aacute;gina que trae gente que agenda y no aparece.</div>
    ${barrasHTML(lgItems,{sufijo:'%'})}
  </div>`:'';

  const reagCard=reagendo?`<div class="chart-card">
    <div class="chart-title">Reagendaron</div>
    <div class="chart-note">Pidieron mover la reunión</div>
    ${barrasHTML([{etiqueta:'Reagendaron',valor:reagendo}],{pctSobre:agendaron.length})}
  </div>`:'';

  return kpis+`<div class="charts-row">${cardAnt}${cardNS}${cardLanding}</div>`+
    `<div class="charts-row">${pendientes}${reagCard}</div>`;
}

// ===== BADGES =====
// Un hueco de datos se muestra como hueco. Antes estos campos venian rellenados
// con etiquetas inventadas por la funcion, asi que un dato real y uno fabricado
// se veian exactamente igual.
const SIN_DATO='Sin dato';
function sinDato(v){
  if(!v||v===SIN_DATO)return`<span class="badge badge-gray">${SIN_DATO}</span>`;
  return esc(v);
}
// La landing concreta, y de donde salio el dato. Un origen "a confirmar" significa
// que el canal se dedujo del calendario usado y conviene chequearlo.
function landingCell(r){
  const v=r['Landing Origen'],o=r['Origen del dato']||'';
  if(!v||v===SIN_DATO)return`<span class="badge badge-gray">${SIN_DATO}</span>`;
  const dudoso=/confirmar/i.test(o);
  return`<span title="Origen del dato: ${esc(o)}">${esc(v)}${dudoso?' <span class="badge badge-gold">?</span>':''}</span>`;
}

// La secuencia y en que mensaje va, que es la etapa real. Al pasar el mouse, la
// fecha del proximo mensaje si esta cargada.
function retargetingCell(r){
  const v=r['Retargeting']||'No';
  if(v==='No')return'<span class="badge badge-gray">No</span>';
  const prox=r['Próximo mensaje'];
  const tip=prox?` title="Próximo mensaje: ${esc(prox)}"`:'';
  return`<span class="badge badge-gold"${tip}>${esc(v)}</span>`;
}

const OWNER_GENERICO='Start Companies Staff';
function vendedorCell(v){
  if(!v)return`<span class="badge badge-gray">${SIN_DATO}</span>`;
  if(v===OWNER_GENERICO)return`<span class="badge badge-gray" title="Due&ntilde;o por defecto en Zoho: nadie lo reasign&oacute; a un vendedor real">Sin asignar</span>`;
  return esc(v);
}

function calificacionBadge(val){
  if(!val)return'<span class="badge badge-gray">Sin dato</span>';const v=val.toLowerCase();
  if(v.includes('sql calificado'))return`<span class="badge badge-green">${val}</span>`;
  if(v.includes('en calificaci')||v.includes('en calificacion'))return`<span class="badge badge-cyan">${val}</span>`;
  if(v.includes('no show'))return`<span class="badge badge-red">${val}</span>`;
  if(v.includes('nuevo mql'))return`<span class="badge badge-blue">${val}</span>`;
  if(v.includes('form nunca'))return`<span class="badge badge-gold">${val}</span>`;
  return`<span class="badge badge-gray">${val}</span>`;
}
function etapaBadge(val){
  if(!val)return'<span class="badge badge-gray">Sin dato</span>';const v=val.toLowerCase();
  if(v.includes('confirmada')||v.includes('cuenta bancaria confirmada'))return`<span class="badge badge-green">${val}</span>`;
  if(v.includes('cuenta bancaria')&&!v.includes('confirmada'))return`<span class="badge badge-cyan">${val}</span>`;
  if(v.includes('filing'))return`<span class="badge badge-blue">${val}</span>`;
  if(v.includes('activa'))return`<span class="badge badge-gold">${val}</span>`;
  return`<span class="badge badge-gray">${val}</span>`;
}
function meetingBadge(val){
  if(!val)return'<span class="badge badge-gray">Sin dato</span>';const v=val.toLowerCase();
  if(v.includes('asisti')&&!v.includes('no asisti'))return`<span class="badge badge-green">${val}</span>`;
  if(v.includes('reagend'))return`<span class="badge badge-gold">${val}</span>`;
  if(v.includes('no asisti'))return`<span class="badge badge-red">${val}</span>`;
  if(v.includes('sin informaci'))return`<span class="badge badge-gray">${val}</span>`;
  return`<span class="badge badge-gray">${val}</span>`;
}
function pagoBadge(val){
  if(!val)return'<span class="badge badge-gray">Sin dato</span>';const v=val.toLowerCase();
  if(v.includes('stripe'))return`<span class="badge badge-purple">${val}</span>`;
  if(v.includes('transferencia'))return`<span class="badge badge-cyan">${val}</span>`;
  if(v.includes('cripto'))return`<span class="badge badge-gold">${val}</span>`;
  if(v.includes('sin pago'))return`<span class="badge badge-gray">${val}</span>`;
  return`<span class="badge badge-gray">${val}</span>`;
}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function onDateChange(){

// ===== PERIOD SELECTOR =====
// The leads dataset now covers several months (see ZOHO_LEADS_MONTHS in the
// function), so periods let you compare instead of always seeing the month.
const PERIODOS={mes:'Este mes',ant:'Mes anterior','3m':'Últimos 3 meses','6m':'Últimos 6 meses',todo:'Todo el período'};
function isoDay(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function periodRange(key){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth();
  if(key==='mes')return{desde:isoDay(new Date(y,m,1)),hasta:isoDay(new Date(y,m+1,0))};
  if(key==='ant')return{desde:isoDay(new Date(y,m-1,1)),hasta:isoDay(new Date(y,m,0))};
  if(key==='3m')return{desde:isoDay(new Date(y,m-2,1)),hasta:isoDay(new Date(y,m+1,0))};
  if(key==='6m')return{desde:isoDay(new Date(y,m-5,1)),hasta:isoDay(new Date(y,m+1,0))};
  return null;// 'todo' / 'custom'
}
function applyPeriodo(key){
  filters.periodo=key;
  const r=periodRange(key);
  if(r){filters.desde=r.desde;filters.hasta=r.hasta}
  else{delete filters.desde;delete filters.hasta}
}
function setPeriodo(key){
  applyPeriodo(key);
  const d=document.getElementById('filter_desde'),h=document.getElementById('filter_hasta');
  if(d)d.value=filters.desde||'';
  if(h)h.value=filters.hasta||'';
  updateMetrics();renderTable();
}
function filterPeriodo(){
  const cur=filters.periodo||'todo';
  const opts=Object.entries(PERIODOS).map(([k,l])=>`<option value="${k}"${k===cur?' selected':''}>${l}</option>`).join('')
    +(cur==='custom'?'<option value="custom" selected>Personalizado</option>':'');
  return `<div class="filter-group"><span class="filter-label">Período</span>
  <select class="filter-select" id="filter_periodo" onchange="setPeriodo(this.value)">${opts}</select></div>`;
}

    html+=multiSelectHTML('vendedor','Vendedor',getUniqueValues(DATA.leads,'Vendedor asignado'));
    html+=filterPeriodo()+filterDate('desde','Desde')+filterDate('hasta','Hasta');
  } else if(currentTab==='llcs'){

// Default period per tab: leads open on the current month (what the dashboard
// always showed); llcs/seguimientos keep showing their whole dataset.
function defaultPeriodo(tab){return tab==='leads'?'mes':'todo'}
function clearFilters(){filters={};applyPeriodo(defaultPeriodo(currentTab));buildFilters();updateMetrics();renderTable()}

function matchesMulti(value,filterKey){
  if(!filters[filterKey])return true;
  return filters[filterKey].includes(value);
}

// "YYYY-MM-DD" -> local Date. new Date('2026-07-01') parses as UTC midnight,
// which in AR (UTC-3) leaks the last 3 hours of the previous month into the range.
function boundDate(s,endOfDay){
  const p=s.split('-').map(Number);
  return endOfDay?new Date(p[0],p[1]-1,p[2],23,59,59,999):new Date(p[0],p[1]-1,p[2],0,0,0,0);
}
function matchesDateRange(dateStr){
  if(!filters.desde&&!filters.hasta)return true;
  const d=parseDate(dateStr);if(!d)return false;
  if(filters.desde&&d<boundDate(filters.desde,false))return false;
  if(filters.hasta&&d>boundDate(filters.hasta,true))return false;
  return true;
}

// Texto libre sobre todas las columnas visibles: buscar a alguien por nombre,
// mail o telefono era imposible en una tabla de 1900 filas sin buscador.
function coincideBusqueda(r){
  const q=(filters.q||'').trim().toLowerCase();
  if(!q)return true;
  return Object.values(r).some(v=>String(v==null?'':v).toLowerCase().includes(q));
}
function coincideAlerta(r){
  if(!filters.alerta)return true;
  const a=ALERTAS.find(x=>x.id===filters.alerta);
  return a?a.test(r):true;
}

function getFilteredRows(){
  if(!DATA)return[];
  if(currentTab==='calidad')return[];   // la solapa de calidad no es una tabla de registros
  const rows=getFilteredRowsBase();
  const filtradas=rows.filter(r=>coincideAlerta(r)&&coincideBusqueda(r));
  return ordenarFilas(filtradas);
}

function getFilteredRowsBase(){
  if(currentTab==='leads'){
    return DATA.leads.filter(r=>{
      if(!matchesMulti(r['Canal'],'canal'))return false;
      if(!matchesMulti(r['Landing Origen'],'landing'))return false;
      if(!matchesMulti(r['Calificaci\u00f3n']||r['Calificacion'],'calificacion'))return false;
      if(!matchesMulti(r['Vendedor asignado'],'vendedor'))return false;
      return matchesDateRange(r['Fecha']);
    });
  } else if(currentTab==='llcs'){
    return DATA.llcs.filter(r=>{
      if(!matchesMulti(r['Etapa'],'etapa'))return false;
      if(!matchesMulti(r['Canal de Origen'],'canal'))return false;
      if(!matchesMulti(r['Confirmaci\u00f3n de pago']||r['Confirmacion de pago'],'pago'))return false;
      return matchesDateRange(r['Fecha']);
    });
  } else {
    return DATA.seguimientos.filter(r=>{
      if(!matchesMulti(r['Estatus del Lead'],'estatus'))return false;
      if(!matchesMulti(r['Canal de Origen'],'canal'))return false;
      if(!matchesMulti(r['Landing Origen'],'landing'))return false;
      if(!matchesMulti(r['Retargeting'],'retargeting'))return false;
      if(!matchesMulti(r['Estado del Meeting'],'meeting'))return false;
      if(!matchesMulti(r['Vendedor'],'vendedor'))return false;
      return matchesDateRange(r['Fecha \u00faltimo meeting']||r['Fecha ultimo meeting']);
    });
  }
}

// ===== ORDEN =====
// Sin esto no se podia ordenar por nada: la tabla salia siempre en el orden en
// que venia del CRM.
let orden={col:null,dir:1};
const COLS_FECHA=['Fecha','Fecha \u00faltimo meeting'];
function ordenarPor(col){
  if(orden.col===col)orden.dir=-orden.dir;
  else{orden={col:col,dir:1}}
  renderTable();
}
function ordenarFilas(rows){
  if(!orden.col)return rows;
  const col=orden.col,dir=orden.dir;
  const esFecha=COLS_FECHA.includes(col);
  return rows.slice().sort((a,b)=>{
    let x=a[col],y=b[col];
    if(esFecha){
      const dx=parseDate(x),dy=parseDate(y);
      return((dx?dx.getTime():0)-(dy?dy.getTime():0))*dir;
    }
    const nx=parseFloat(x),ny=parseFloat(y);
    if(!isNaN(nx)&&!isNaN(ny)&&String(x).trim()!==''&&String(y).trim()!=='')return(nx-ny)*dir;
    return String(x==null?'':x).localeCompare(String(y==null?'':y),'es',{sensitivity:'base'})*dir;
  });
}
function th(col,titulo){
  const activa=orden.col===col;
  const flecha=activa?(orden.dir>0?' \u25b2':' \u25bc'):'';
  return`<th class="th-orden${activa?' th-activa':''}" onclick="ordenarPor('${col.replace(/'/g,"\\'")}')" title="Ordenar por ${esc(titulo)}">${esc(titulo)}<span class="th-flecha">${flecha}</span></th>`;
}

function onBuscar(v){
  filters.q=v;
  clearTimeout(onBuscar._t);

}

// ===== CALIDAD DE DATOS =====
// Cuanto de cada campo del CRM esta realmente cargado, mes a mes. Sin esto, un
// numero vacio y un numero real se ven igual en el resto del dashboard.
function mesLabel(k){const p=k.split('-');return MES_CORTO[parseInt(p[1],10)-1]+' '+p[0].slice(2)}
function qClass(p){return p>=70?'q-ok':p>=30?'q-mid':'q-bad'}

function bloqueCalidad(titulo,b){
  if(!b||!b.meses||!b.meses.length)return'';
  const m=b.meses;
  return `<div class="q-block"><div class="q-title">${esc(titulo)}</div>
  <div class="table-scroll"><table class="q-table"><thead><tr><th>Campo</th>
  ${m.map(x=>`<th>${mesLabel(x.mes)}<span class="q-total">${x.total} reg.</span></th>`).join('')}
  </tr></thead><tbody>
  ${b.campos.map((c,i)=>`<tr><td class="q-field">${esc(c)}</td>${m.map(x=>`<td class="q-cell ${qClass(x.pct[i])}">${x.pct[i]}%</td>`).join('')}</tr>`).join('')}
  </tbody></table></div></div>`;
}

function renderCalidad(){
  if(!DATA||!DATA.calidad)return'<div class="loading"><div class="loading-text">Sin datos de calidad</div></div>';
  return `<div class="q-intro">Porcentaje de registros que tienen <strong>cargado</strong> cada campo en Zoho.
  El dashboard solo puede mostrar lo que est&aacute; ac&aacute; en verde: donde dice 0% no hay un problema de reporte,
  no hay dato. <strong>Vendedor real</strong> cuenta los leads cuyo due&ntilde;o no es el usuario gen&eacute;rico
  &laquo;Start Companies Staff&raquo;.</div>
  ${bloqueCalidad('Leads',DATA.calidad.leads)}
  ${bloqueCalidad('LLCs / Aperturas',DATA.calidad.llcs)}`;
}

function renderMetricsCalidad(){
  if(!DATA||!DATA.calidad)return'';
  const bloques=[['Leads',DATA.calidad.leads],['LLCs / Aperturas',DATA.calidad.llcs]];
  return bloques.map(([t,b])=>{
    if(!b||!b.meses||!b.meses.length)return'';
    const ult=b.meses[b.meses.length-1];
    const cards=b.campos.map((c,i)=>{
      const p=ult.pct[i],cl=p>=70?' green':p>=30?' gold':' red';
      return `<div class="metric-card${cl}"><div class="metric-label">${esc(c)}</div><div class="metric-value">${p}%</div></div>`;
    }).join('');
    return mSection('q_'+t.slice(0,4),`Completitud en ${mesLabel(ult.mes)} · ${t}`,`<div class="metrics-grid">${cards}</div>`);
  }).join('');
}

// ===== RENDER =====
function renderTable(){
  if(!DATA)return;
  const el=document.getElementById('tableContent');
  const rows=getFilteredRows();
  document.getElementById('tableTitle').textContent=TITLES[currentTab];
  document.getElementById('tableCount').textContent=currentTab==='calidad'?'':rows.length+' registros';
  const buscador=document.getElementById('buscador');
  if(buscador){
    buscador.style.display=currentTab==='calidad'?'none':'';
    if(buscador.value!==(filters.q||''))buscador.value=filters.q||'';
  }
  // Si llegaste acá clickeando una alerta, la tabla está recortada: decilo y dejá
  // salir de un clic, si no parece que faltan registros.
  // Las vistas de Analytics sincronizan solas y se atrasan sin avisar. Si el
  // dataset que estas mirando quedo viejo, decirlo arriba de la tabla.
  let aviso=avisoFrescura();
  if(filters.alerta){
    const a=ALERTAS.find(x=>x.id===filters.alerta);
    if(a)aviso+=`<div class="aviso-filtro">Mostrando solo: <b>${esc(a.titulo)}</b>
      <button onclick="quitarAlerta()">Ver todo de nuevo</button></div>`;
  }
  if(currentTab==='calidad')el.innerHTML=renderCalidad();
  else if(currentTab==='leads')el.innerHTML=aviso+renderLeads(rows);
  else if(currentTab==='llcs')el.innerHTML=aviso+renderLLCs(rows);
  else el.innerHTML=aviso+renderSeguimientos(rows);
}

function quitarAlerta(){
  delete filters.alerta;
  updateMetrics();renderTable();
}

// Leads salen del CRM en vivo; LLCs y Seguimientos de vistas de Zoho Analytics que
// sincronizan por su cuenta. Cuando esa sync se atrasa, la tabla muestra datos
// viejos sin ninguna senal: esto la pone.
function avisoFrescura(){
  if(!DATA||!DATA.frescura||currentTab==='calidad')return'';
  const iso=DATA.frescura[currentTab];
  if(!iso)return'';
  const d=new Date(iso);if(isNaN(d))return'';
  const dias=Math.floor((Date.now()-d.getTime())/86400000);
  if(dias<2)return'';
  const fecha=d.toLocaleDateString('es-AR',{day:'2-digit',month:'short'});
  const fuente=currentTab==='leads'?'el CRM':'la vista de Zoho Analytics';
  return`<div class="aviso-filtro">El registro más nuevo acá es del <b>${fecha}</b>, hace ${dias} días.
    La sincronización de ${fuente} está atrasada: lo que ves no incluye lo último.</div>`;
}

function switchTab(tab){
  currentTab=tab;filters={};orden={col:null,dir:1};applyPeriodo(defaultPeriodo(tab));
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',TABS[i]===tab));
  updateMetrics();buildFilters();renderTable();
}

// ===== EXPORT =====
function getExportData(){
  const rows=getFilteredRows();let headers,data;
  if(currentTab==='calidad'){
    // La matriz de completitud, para poder mandarsela al equipo tal cual.
    const c=DATA&&DATA.calidad;
    headers=['Dataset','Campo'].concat(c&&c.leads.meses.length?c.leads.meses.map(m=>mesLabel(m.mes)):[]);
    data=[];
    [['Leads',c&&c.leads],['LLCs',c&&c.llcs]].forEach(([t,b])=>{
      if(!b||!b.meses.length)return;
      b.campos.forEach((campo,i)=>data.push([t,campo].concat(b.meses.map(m=>m.pct[i]+'%'))));
    });
    return{headers,data};
  }
  if(currentTab==='leads'){
    headers=['Fecha','Servicio','Nombre','Canal','Landing Origen','Origen del dato','Calificacion','Telefono','Mail','Agendo','Retargeting','Proximo mensaje','Modalidad de cierre','Modalidad de pago','Vendedor'];
    data=rows.map(r=>[r['Fecha'],r['Servicio'],r['Nombre y Apellido'],r['Canal'],r['Landing Origen'],r['Origen del dato'],r['Calificaci\u00f3n']||r['Calificacion'],r['M\u00f3vil']||r['Movil']||r['Tel\u00e9fono']||r['Telefono'],r['Mail'],r['\u00bfAgend\u00f3?'],r['Retargeting'],r['Pr\u00f3ximo mensaje'],r['Modalidad de cierre'],r['Modalidad de pago'],r['Vendedor asignado']]);
  }else if(currentTab==='llcs'){
    headers=['Fecha','LLC','Etapa','Nombre','Email','Telefono','Canal','Vendedor','Pago'];
    data=rows.map(r=>[r['Fecha'],r['LLC'],r['Etapa'],r['Nombre'],r['Email'],r['Tel\u00e9fono']||r['Telefono'],r['Canal de Origen'],r['Vendedor'],r['Confirmaci\u00f3n de pago']||r['Confirmacion de pago']]);
  }else{
    headers=['Fecha','Nombre','Mail','Estatus','Vendedor','Canal','Landing Origen','Retargeting','Proximo mensaje','Meeting','Descripcion'];
    data=rows.map(r=>[r['Fecha \u00faltimo meeting']||r['Fecha ultimo meeting'],(r['Nombre']||'')+' '+(r['Apellido']||''),r['Mail'],r['Estatus del Lead'],r['Vendedor'],r['Canal de Origen'],r['Landing Origen'],r['Retargeting'],r['Pr\u00f3ximo mensaje'],r['Estado del Meeting'],r['Descripci\u00f3n']||r['Descripcion']]);
  }
  return{headers,data};
}

function exportCSV(){
  const{headers,data}=getExportData();
  const csv=[headers.join(','),...data.map(r=>r.map(v=>`"${(v||'').replace(/"/g,'""')}"`).join(','))].join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`SC_${TITLES[currentTab].replace(/ /g,'_')}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();URL.revokeObjectURL(a.href);
}

function exportPDF(){
  if(!window.jspdf||!window.jspdf.jsPDF){showError('Cargando libreria PDF, intenta de nuevo en unos segundos...');return}
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  doc.setFillColor(0,22,39);doc.rect(0,0,297,25,'F');
  doc.setTextColor(255,255,255);doc.setFontSize(16);doc.text('Start Companies',14,12);
  doc.setFontSize(10);doc.setTextColor(136,153,170);
  doc.text(TITLES[currentTab]+' - '+new Date().toLocaleDateString('es-AR'),14,20);
  const{headers,data}=getExportData();
  doc.autoTable({head:[headers],body:data.map(r=>r.map(v=>v||'')),startY:30,theme:'grid',
    styles:{fontSize:7,cellPadding:2,textColor:[30,30,30]},
    headStyles:{fillColor:[0,106,254],textColor:[255,255,255],fontStyle:'bold',fontSize:8},
    alternateRowStyles:{fillColor:[240,245,250]},margin:{left:10,right:10}});
  doc.save(`SC_${TITLES[currentTab].replace(/ /g,'_')}_${new Date().toISOString().slice(0,10)}.pdf`);
}

// ===== FETCH =====
function showError(msg){const el=document.getElementById('errorBanner');el.textContent=msg;el.style.display='block';setTimeout(()=>el.style.display='none',10000)}

async function fetchData(){
  const btn=document.getElementById('btnRefresh');
  if(btn)btn.disabled=true;
  try{
    const res=await fetch('/.netlify/functions/zoho-data',{headers:authHeaders()});
    if(res.status===401){sesionVencida();return}
    if(!res.ok){
      const j=await res.json().catch(()=>({}));
      throw new Error(j.error||('HTTP '+res.status));
    }
    DATA=await res.json();if(DATA.error)throw new Error(DATA.error);
    // Filter out TimelinesAI junk entries
    DATA.leads=DATA.leads.filter(r=>{
      const desc=(r['Descripci\u00f3n']||r['Descripcion']||'').toLowerCase();
      const name=(r['Nombre y Apellido']||'').toLowerCase();
      return !desc.includes('timelines') && !name.includes('new whatsapp contact');
    });
    await loadNotes();
    if(!filters.periodo)applyPeriodo(defaultPeriodo(currentTab));
    updateMetrics();buildFilters();renderTable();
    const cacheStatus=res.headers.get('X-Cache');
    const cacheLabel=cacheStatus==='HIT'?' (cache)':cacheStatus==='STALE'?' (cache anterior)':'';
    let ventana='';
    if(DATA.leadsSince){
      // leadsSince is built in the function's timezone (UTC on Netlify); read it
      // back in UTC or a AR browser shows the previous month.
      const s=new Date(DATA.leadsSince);
      ventana=' · leads desde '+MES_CORTO[s.getUTCMonth()]+' '+s.getUTCFullYear();
    }
    document.getElementById('lastUpdate').textContent='Actualizado: '+new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+cacheLabel+ventana;
    document.getElementById('errorBanner').style.display='none';
  }catch(err){showError('Error al cargar datos: '+err.message)}
  finally{if(btn)btn.disabled=false}
}

function manualRefresh(){fetchData()}

// ===== NOTES =====
let NOTES={};
let currentNoteKey='';

async function loadNotes(){
  try{
    const r=await fetch('/.netlify/functions/notes',{headers:authHeaders()});
    if(r.ok){NOTES=await r.json();return}
    // Fallaba en silencio: las notas estaban rotas en produccion y nadie lo sabia.
    const j=await r.json().catch(()=>({}));
    showError('No se pudieron cargar las notas: '+(j.error||('HTTP '+r.status)));
  }catch(e){showError('No se pudieron cargar las notas: '+e.message)}
}

function noteBtn(key,label){
  const has=NOTES[key];
  const tip=has?has.text.substring(0,40)+'...':'Agregar nota';
  return `<button class="note-btn${has?' has-note':''}" onclick="openNote('${esc(key)}','${esc(label)}')" title="${esc(tip)}">${has?'\u270F\uFE0F':'\u270F\uFE0F'}</button>`;
}

function openNote(key,label){
  currentNoteKey=key;
  document.getElementById('noteTitle').textContent=label;
  const note=NOTES[key];
  document.getElementById('noteNombre').value=nombreGuardado();
  document.getElementById('noteText').value=note?note.text:'';
  document.getElementById('noteWho').textContent=note?`Editado por ${note.user} - ${new Date(note.updatedAt).toLocaleString('es-AR')}`:'';
  document.getElementById('noteOverlay').classList.add('show');
  document.getElementById('noteText').focus();
}

function closeNote(){document.getElementById('noteOverlay').classList.remove('show');currentNoteKey=''}

async function saveNote(){
  const text=document.getElementById('noteText').value;
  // El nombre ya no viene del login (que solo pide contrasena): se escribe aca la
  // primera vez y queda guardado en el navegador para las proximas.
  const userName=(document.getElementById('noteNombre').value||'').trim();
  if(userName){
    localStorage.setItem('sc_nombre',userName);
    const badge=document.getElementById('userBadge');
    badge.textContent=userName;badge.style.display='';
  }
  try{
    const r=await fetch('/.netlify/functions/notes',{method:'POST',headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({key:currentNoteKey,text,user:userName})});
    if(r.ok){
      if(!text.trim()){delete NOTES[currentNoteKey]}
      else{NOTES[currentNoteKey]=await r.json()}
      renderTable();
    }else{
      // Antes esto se descartaba: el modal se cerraba como si hubiera guardado.
      const j=await r.json().catch(()=>({}));
      showError('No se pudo guardar la nota: '+(j.error||('HTTP '+r.status)));
    }
  }catch(e){showError('Error guardando nota: '+e.message)}
  closeNote();
}
